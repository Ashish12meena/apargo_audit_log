# Local development: MongoDB single-node replica set on localhost, readable logs, debug logging.
# Kafka and Eureka addresses come from ../platform.env (fallback: application.yml).
audit:
  archiver:
    store:
      type: ${AUDIT_ARCHIVE_STORE:LOCAL}
      local-dir: ${AUDIT_ARCHIVE_LOCAL_DIR:./build/archive}
  security:
    internal-api-key: ${AUDIT_INTERNAL_API_KEY:dev-internal-key}

management:
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_DETAILS:always}

logging:
  level:
    com.apargo: ${LOG_LEVEL_APP:${AUDIT_LOG_LEVEL:DEBUG}}
