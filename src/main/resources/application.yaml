spring:
  application:
    name: auditlog

  data:
    mongodb:
      uri: mongodb+srv://root:ashishmongo123@cluster0.sw3tj.mongodb.net/audit

  kafka:
    consumer:
      group-id: auditlog-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: MANUAL

messaging:
  audit:
    topics:
      campaign: whatsapp.campaign.audit.events
      conversation: whatsapp.conversation.audit.events
      dispatch: whatsapp.dispatch.audit.events